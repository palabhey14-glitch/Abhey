<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rewired Client App</title>
  <meta name="description" content="Daily check-ins, weekly progress and photos for Rewired Coaching clients.">
  <meta name="theme-color" content="#2444f9">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rewired">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="forms.css">
</head>
<body class="app">
  <div id="root" aria-live="polite">
    <main class="screen center"><p>Loading…</p></main>
  </div>
  <noscript>Please turn on JavaScript to use the Rewired app.</noscript>
  <script src="config.js"></script>
  <script src="vendor/supabase-2.117.2.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/ingredients.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/nutrition-ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/forms-ui.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/app.js"></script>
  <!-- Netlify reads this at deploy time so the app can post check-in notices to it.
       Netlify's form notification emails each one to the coach. Not shown. -->
  <form name="checkin-complete" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="subject"><input name="client_name"><input name="client_email">
    <input name="week"><input name="sent_at"><input name="review_link">
  </form>
</body>
</html>
