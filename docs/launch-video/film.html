<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540">
<title>Rewired launch film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root { --bg: #ebe9e6; --ink: #121212; --soft: #85807a; --mute: #a19b94; --blue: #2444f9; --amber: #e3a33b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 58%, #f6f5f3 0%, #ebe9e6 72%); overflow: hidden; }
  .ring { position: absolute; left: 62%; top: 560px; width: 620px; height: 620px; margin-left: -310px; border-radius: 50%;
    border: 1px solid rgba(18,18,18,.08); box-shadow: 0 0 0 70px rgba(255,255,255,.22), 0 0 0 71px rgba(18,18,18,.05); }
  .person { position: absolute; right: -150px; bottom: 0; height: 600px; transform-origin: 60% 100%; }
  .person img { height: 100%; width: auto; display: block; }
  h1 { position: absolute; left: 36px; right: 36px; top: 92px; font-weight: 400; font-size: 72px; line-height: .98; letter-spacing: -.04em; }
  h1 span { display: block; }
  h1 .m { color: var(--mute); }
  .phone { position: absolute; left: 50%; top: 150px; width: 390px; height: 720px; margin-left: -195px; transform-origin: 50% 0;
    border-radius: 46px; background: #fff; padding: 0; box-shadow: 0 40px 90px rgba(20,16,10,.18), 0 0 0 10px #fff, 0 0 0 11px rgba(18,18,18,.08); overflow: hidden; }
  .phone iframe { width: 390px; height: 720px; border: 0; display: block; border-radius: 46px; }
  .tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(18,18,18,.18); border: 2px solid rgba(255,255,255,.9); pointer-events: none; opacity: 0; }
  .cap { position: absolute; left: 34px; right: 30px; top: 40px; font-weight: 500; font-size: 36px; line-height: 1.04; letter-spacing: -.03em; }
  .cap .m { color: var(--soft); }
  .end { position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; padding: 0 40px; gap: 26px; opacity: 0; }
  .end .logo { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; letter-spacing: -.02em; }
  .end .logo img { width: 54px; height: 54px; border-radius: 15px; }
  .end h2 { font-weight: 400; font-size: 54px; line-height: 1; letter-spacing: -.04em; }
  .end h2 .m { color: var(--mute); }
  .end .btn { display: inline-flex; align-items: center; height: 64px; padding: 0 30px; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 600; font-size: 22px; }
  .end .url { font-weight: 500; font-size: 22px; color: var(--soft); }
</style>
</head>
<body>
<div class="stage">
  <div class="ring" id="ring"></div>
  <div class="person" id="person"><img src="/assets/abhey/rw-smile-hd-1559.webp" alt=""></div>
  <h1 id="hero"><span>Your next</span><span>chapter,</span><span class="m">rewired.</span></h1>
  <div class="cap" id="cap"></div>
  <div class="phone" id="phone"><iframe id="app" src="/app/#home"></iframe><div class="tap" id="tap"></div></div>
  <div class="end" id="end">
    <div class="logo"><img src="/app/icons/icon-192.png" alt="" onerror="this.src='/assets/app-icon.png'">Rewired</div>
    <h2>Rewired Premium Coaching <span class="m">with Abhey Pal</span></h2>
    <span class="btn">Book a Strategy Call</span>
    <span class="url">rewiredbyabhey.com</span>
  </div>
</div>
<script>
  // Every frame is drawn from render(t), t in seconds. The app inside the
  // phone is the real client app; the driver moves it (navigation, scroll, taps).
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const seg = (t, a, b) => (t - a) / (b - a);

  // Captions: [start, end, html]. No labels, no colons.
  window.CAPS = [];
  window.PHONE_IN = 2.6;
  window.END_AT = 99;

  function caption(t) {
    const c = window.CAPS.find(([a, b]) => t >= a && t < b);
    const el = $('cap');
    if (!c) { el.style.opacity = 0; return; }
    if (el.dataset.k !== String(c[0])) { el.innerHTML = c[2]; el.dataset.k = String(c[0]); }
    const fin = out(seg(t, c[0], c[0] + .45)), fout = 1 - ease(seg(t, c[1] - .3, c[1]));
    el.style.opacity = Math.min(fin, fout);
    el.style.transform = `translateY(${(1 - fin) * 14}px)`;
  }

  window.render = function (t, tap) {
    // Shot 1, the photo and the line from the site.
    const push = 1 + .05 * clamp(t / 3);
    const leave = ease(seg(t, PHONE_IN - .2, PHONE_IN + .8));
    $('person').style.transform = `scale(${push}) translateY(${leave * 120}px)`;
    $('person').style.opacity = 1 - leave;
    $('ring').style.opacity = 1 - leave * .6;
    const hin = (i) => out(seg(t, .15 + i * .18, .85 + i * .18));
    [...$('hero').children].forEach((s, i) => { s.style.opacity = hin(i) * (1 - leave); s.style.transform = `translateY(${(1 - hin(i)) * 24 - leave * 30}px)`; });
    // Shot 2 onwards, the phone.
    const pin = ease(seg(t, PHONE_IN, PHONE_IN + 1.1));
    const pout = ease(seg(t, END_AT - .3, END_AT + .6));
    $('phone').style.transform = `translateY(${(1 - pin) * 820 + pout * 900}px) scale(1.12)`;
    caption(t);
    // Tap ring
    const tp = $('tap');
    if (tap) { tp.style.left = tap.x + 'px'; tp.style.top = tap.y + 'px'; tp.style.opacity = tap.a; tp.style.transform = `scale(${tap.s})`; }
    else tp.style.opacity = 0;
    // End card
    const e = out(seg(t, END_AT + .2, END_AT + 1));
    $('end').style.opacity = e;
    $('end').style.transform = `translateY(${(1 - e) * 20}px)`;
  };
  render(0);
</script>
</body>
</html>
