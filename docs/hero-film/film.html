<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: M; src: url(../../site/assets/fonts/montserrat-latin.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: M, sans-serif; color: #fff; background: #2444f9; }
#bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 75% 40%, #3a5bff 0%, #2444f9 45%, #1a2fc4 100%); }
#grid { position: absolute; inset: -10%; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 80px 80px; }
#glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(140,180,255,.45), transparent 60%); }
#calm { position: absolute; inset: 0; }
.land #calm { background: linear-gradient(90deg, rgba(11,37,69,.55) 0%, rgba(11,37,69,.25) 38%, transparent 60%); }
.port #calm { background: linear-gradient(0deg, rgba(11,37,69,.6) 0%, rgba(11,37,69,.2) 40%, transparent 58%); }
#stage { position: absolute; display: flex; flex-direction: column; justify-content: center; }
.land #stage { left: 50%; right: 5%; top: 8%; bottom: 8%; }
.port #stage { left: 12%; right: 12%; top: 7%; height: 38%; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; }
.kick { font-weight: 700; letter-spacing: .35em; font-size: 22px; opacity: .85; margin-bottom: 18px; }
.big { font-weight: 900; font-size: 104px; line-height: .98; letter-spacing: -.01em; }
.port .big { font-size: 84px; }
.port .logo { font-size: 180px; }
.port .word { font-size: 52px; }
.bar { margin-top: 34px; }
.bar .lab { display: flex; justify-content: space-between; font-weight: 800; letter-spacing: .2em; font-size: 22px; margin-bottom: 12px; }
.bar .track { height: 26px; border-radius: 20px; background: rgba(255,255,255,.18); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 20px; background: #fff; }
.hcard { display: flex; align-items: center; gap: 22px; padding: 22px 26px; margin: 12px 0; border-radius: 22px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(5,15,60,.25); }
.hcard .ic { width: 64px; height: 64px; border-radius: 16px; background: #fff; display: grid; place-items: center; font-size: 34px; }
.hcard b { display: block; font-size: 32px; font-weight: 800; }
.hcard small { display: block; font-size: 21px; font-weight: 600; opacity: .8; margin-top: 2px; }
.hcard .ck { margin-left: auto; width: 52px; height: 52px; border-radius: 50%; background: #1f9d63; display: grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 34px; }
.chip { padding: 14px 26px; border-radius: 99px; background: #fff; color: #2444f9; font-weight: 800; font-size: 28px; }
.logo { font-weight: 900; font-size: 220px; line-height: .9; }
.logo span { color: #fff; }
.word { font-weight: 900; font-size: 64px; letter-spacing: .02em; margin-top: 10px; }
.sub { font-weight: 600; font-size: 26px; opacity: .85; margin-top: 10px; }
</style></head>
<body class="land">
<div id="bg"></div><div id="grid"></div><div id="glow"></div><div id="calm"></div>
<div id="stage">
  <div class="scene" id="s1"><div class="kick">THE RECOMP</div><div class="big" id="l1">LOSE THE FAT.</div><div class="big" id="l2">GAIN MUSCLE.</div></div>
  <div class="scene" id="s2"><div class="kick">12 WEEKS</div><div class="big" style="font-size:80px">REBUILD YOUR BODY.</div>
    <div class="bar"><div class="lab"><span>BODY FAT</span><span>▼</span></div><div class="track"><div class="fill" id="f1"></div></div></div>
    <div class="bar"><div class="lab"><span>MUSCLE</span><span>▲</span></div><div class="track"><div class="fill" id="f2"></div></div></div></div>
  <div class="scene" id="s3"><div class="kick">EVERY DAY, IN THE APP</div>
    <div class="hcard" id="c1"><div class="ic">👟</div><div><b>Daily steps</b><small>10,000 a day</small></div><div class="ck"><svg width="30" height="30" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="hcard" id="c2"><div class="ic">🍗</div><div><b>Protein</b><small>Target hit</small></div><div class="ck"><svg width="30" height="30" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="hcard" id="c3"><div class="ic">😴</div><div><b>Sleep</b><small>7+ hours</small></div><div class="ck"><svg width="30" height="30" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div>
  <div class="scene" id="s4"><div class="kick">NO BLAND DIETS</div><div class="big">KEEP THE<br>FAMILY FOOD.</div>
    <div class="chips"><span class="chip" id="p1">Dal</span><span class="chip" id="p2">Roti</span><span class="chip" id="p3">Biryani</span><span class="chip" id="p4">Paneer</span></div></div>
  <div class="scene" id="s5" style="align-items:flex-start"><div class="logo">R<span>.</span></div><div class="word">REWIRED COACHING</div><div class="sub">by Abhey</div></div>
</div>
<script>
const D = 14;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inout = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
const $ = (id) => document.getElementById(id);
// visibility window: fade in over 0.35s at a, out over 0.35s at b
const vis = (t, a, b) => clamp((t - a) / .35) * clamp((b - t) / .35);
function slam(el, t, a) { const p = ease((t - a) / .45); el.style.opacity = p; el.style.transform = `translateY(${(1-p)*40}px) scale(${1.15 - .15*p})`; el.style.filter = `blur(${(1-p)*10}px)`; }
function render(t) {
  const W = innerWidth, H = innerHeight;
  $('grid').style.transform = `translate(${(t/D)*80}px, ${(t/D)*80}px)`;
  $('glow').style.left = `${W*.55 + Math.sin(t/D*2*Math.PI)*W*.12 - 450}px`;
  $('glow').style.top = `${H*.35 + Math.cos(t/D*2*Math.PI)*H*.12 - 450}px`;
  const s = [[.3,3.2],[3.2,6.6],[6.6,10],[10,12.4],[12.4,13.7]];
  s.forEach(([a,b],i) => { const el = $('s'+(i+1)); const v = vis(t,a,b); el.style.opacity = v; el.style.transform = `translateY(${(1-v)*-20}px)`; });
  slam($('l1'), t, .45); slam($('l2'), t, 1.4);
  $('f1').style.width = `${70 - 42*inout((t-3.8)/2.2)}%`;
  $('f2').style.width = `${32 + 52*inout((t-3.8)/2.2)}%`;
  ['c1','c2','c3'].forEach((id,i) => { const p = ease((t-6.9-i*.45)/.6); const el = $(id); el.style.opacity = p; el.style.transform = `translateX(${(1-p)*120}px)`;
    const ck = el.querySelector('.ck'); const q = ease((t-7.5-i*.45)/.35); ck.style.transform = `scale(${q})`; });
  ['p1','p2','p3','p4'].forEach((id,i) => { const p = ease((t-10.6-i*.18)/.4); const el = $(id); el.style.opacity = p; el.style.transform = `translateY(${(1-p)*30}px) rotate(${(1-p)*(i%2?6:-6)}deg)`; });
  const lp = ease((t-12.5)/.5); $('s5').querySelector('.logo').style.transform = `scale(${.8+.2*lp})`;
}
window.setMode = (m) => { document.body.className = m; };
window.render = render;
if (location.hash === '#play') { const t0 = performance.now(); (function f(){ render(((performance.now()-t0)/1000) % D); requestAnimationFrame(f); })(); }
</script>
</body></html>
