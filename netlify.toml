# Netlify hosting: publishes the "site" folder as-is. No build step.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The app always checks for a fresh copy of its own files.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# Belly check quiz is shared by link only: keep it out of search engines.
[[headers]]
  for = "/belly-check/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Server functions (barcode lookup, recipe import). They read SUPABASE_URL,
# SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY from the Netlify environment.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The older combined Privacy & Terms page was replaced by /terms.html and
# /privacy.html. Send old links to the current Terms.
[[redirects]]
  from = "/legal.html"
  to = "/terms.html"
  status = 301
  force = true
